name: Publish to WinGet
on:
  release:
    types: [released]
  # Release events never reach this workflow in practice: the release is created by
  # GITHUB_TOKEN inside Release, and events caused by that token do not start new runs.
  # Dispatch this with the tag whenever a release needs submitting.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v0.3.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    name: Update winget package
    runs-on: ubuntu-latest
    steps:
      # Auto-submits a manifest PR to microsoft/winget-pkgs for the NSIS .exe on every published release.
      # Requires: a fork of microsoft/winget-pkgs under the same account, and a classic PAT (public_repo +
      # workflow scopes) stored as the WINGET_TOKEN secret. Only kicks in once a first version is merged
      # manually (the action uses an existing package as its base). See README "WinGet".
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Benny93.FastScanCleaner
          installers-regex: '\.exe$' # only the Windows NSIS installer
          max-versions-to-keep: 5
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
