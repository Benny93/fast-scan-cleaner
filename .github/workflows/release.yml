name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, formats: dmg } # Apple Silicon
          - { os: macos-13, formats: dmg } # Intel
          - { os: windows-latest, formats: nsis }
          - { os: ubuntu-24.04, formats: "deb,appimage" } # jammy's pipewire 0.3.59 headers do not compile xcap's libspa 0.10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libfontconfig-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev clang libfuse2
      - run: cargo install cargo-packager --locked
      - run: cargo packager --release --formats ${{ matrix.formats }}
      # Installers are intentionally unsigned (no Apple Developer / code-signing cert).
      # macOS Gatekeeper blocks the app on first launch; the release body links the workaround.
      - uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          body: |
            ## First launch

            These installers are **unsigned and not notarized**.

            - **macOS**: Gatekeeper will refuse the app (on macOS 15+ it says "…is damaged and can't be opened"; right-click → Open does not bypass it). After dragging the app into /Applications, run once:
              ```
              xattr -dr com.apple.quarantine "/Applications/FastScanCleaner.app"
              ```
            - **Windows**: SmartScreen shows "unknown publisher" — click **More info → Run anyway**.

            See the README for details.
          files: |
            target/dist/*.dmg
            target/dist/*.exe
            target/dist/*.deb
            target/dist/*.AppImage
