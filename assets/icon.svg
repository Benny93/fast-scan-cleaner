<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- sparkle: "clean" -->
  <path d="M790 210 l14 40 40 14 -40 14 -14 40 -14 -40 -40 -14 40 -14z" fill="#fde68a"/>
  <path d="M220 800 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9z" fill="#bfdbfe" opacity="0.9"/>
  <!-- hard drive -->
  <g filter="url(#shadow)">
    <rect x="212" y="300" width="600" height="440" rx="72" fill="url(#metal)"/>
    <path d="M212 600 h600 v68 a72 72 0 0 1 -72 72 h-456 a72 72 0 0 1 -72 -72z" fill="url(#base)"/>
  </g>
  <rect x="260" y="642" width="300" height="20" rx="10" fill="#475569" opacity="0.55"/>
  <circle cx="742" cy="652" r="22" fill="#4ade80"/>
  <circle cx="736" cy="645" r="7" fill="#dcfce7"/>
  <!-- smile -->
  <path d="M440 535 q72 48 144 0" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <!-- sunglasses -->
  <path d="M232 405 L282 398" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
  <path d="M792 405 L742 398" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
  <path d="M272 388 h202 q14 0 12 16 l-12 70 q-8 44 -56 44 h-96 q-44 0 -54 -44 l-10 -70 q-2 -16 14 -16z" fill="url(#lens)" stroke="#020617" stroke-width="10"/>
  <path d="M550 388 h202 q16 0 14 16 l-10 70 q-10 44 -54 44 h-96 q-48 0 -56 -44 l-12 -70 q-2 -16 12 -16z" fill="url(#lens)" stroke="#020617" stroke-width="10"/>
  <path d="M484 402 q28 -18 56 0" fill="none" stroke="#020617" stroke-width="16" stroke-linecap="round"/>
  <!-- lens glints -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M318 470 l44 -58" stroke-opacity="0.6" stroke-width="16"/>
    <path d="M360 478 l26 -34" stroke-opacity="0.35" stroke-width="10"/>
    <path d="M596 470 l44 -58" stroke-opacity="0.6" stroke-width="16"/>
    <path d="M638 478 l26 -34" stroke-opacity="0.35" stroke-width="10"/>
  </g>
</svg>
